name: 每月重新訓練模型

# 每月第一個星期六 09:23（台北）用最新約 3 年日 K 重新訓練；新模型驗證成績較差就保留舊模型。
on:
  schedule:
    - cron: '23 1 * * 6'   # 每週六觸發，下面只讓「每月第一個星期六」真的執行（cron 的日期與星期是「或」的關係）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retrain
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        run: |
          D=$(TZ=Asia/Taipei date +%-d)
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$D" -le 7 ]; then echo "go=1" >> "$GITHUB_OUTPUT"; else echo "go=0" >> "$GITHUB_OUTPUT"; echo "不是本月第一個星期六，略過"; fi
  train:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet numpy pandas scikit-learn skl2onnx onnxruntime
      - name: 下載訓練資料
        run: node pipeline/prefetch-train.js
      - name: 訓練
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          mkdir -p /tmp/oldmodels && cp ml/models/* /tmp/oldmodels/
          python ml/train.py --market us
          if [ -n "$FINMIND_TOKEN" ]; then python ml/train.py --market tw --finmind-token "$FINMIND_TOKEN"; else python ml/train.py --market tw; fi
          python ml/compare_models.py /tmp/oldmodels
      - name: 存檔
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ml/models
          git diff --cached --quiet && { echo "模型沒有變更"; exit 0; }
          git commit -q -m "model: monthly retrain $(date -u +%F)" -m "$(cat /tmp/oldmodels/report.txt)"
          git push -q
