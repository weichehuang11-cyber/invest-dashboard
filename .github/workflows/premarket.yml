name: 盤前資訊

# 台股開盤前（08:15）與美股開盤前（約 21:00）各送一份盤前資訊：推播＋（選用）電子郵件。
# 主要由「排程器」準時觸發；下面的內建排程只是備援，同一場重複觸發會自動略過。
on:
  schedule:
    - cron: '17 0 * * 1-5'     # 08:17（台北）台股
    - cron: '57 12 * * 1-5'    # 20:57（台北）美股
  workflow_dispatch:
    inputs:
      market:
        description: 'tw＝台股盤前、us＝美股盤前（空白依時間判斷）'
        required: false
        default: ''

permissions:
  actions: read
  contents: read

concurrency:
  group: premarket
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - name: 判斷場次、避免重複
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
          IN: ${{ github.event.inputs.market }}
        run: |
          H=$((10#$(TZ=Asia/Taipei date +%H)))
          MK="$IN"; [ -z "$MK" ] && { [ $H -lt 14 ] && MK=tw || MK=us; }
          echo "market=$MK" >> "$GITHUB_OUTPUT"
          # 手動指定場次一律送；自動觸發時，同一場（今天同一個上午／晚上）已經成功送過就略過
          if [ -z "$IN" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            if [ $H -lt 14 ]; then FROM=$(TZ=Asia/Taipei date -d 'today 00:00' -u +%FT%TZ); else FROM=$(TZ=Asia/Taipei date -d 'today 14:00' -u +%FT%TZ); fi
            N=$(gh api "repos/${{ github.repository }}/actions/workflows/premarket.yml/runs?per_page=10&created=>=$FROM" --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.conclusion == \"success\")] | length")
            [ "$N" -gt 0 ] && { echo "這一場已送過，略過"; echo "skip=1" >> "$GITHUB_OUTPUT"; }
          fi
          true
      - uses: actions/checkout@v4
        if: steps.slot.outputs.skip != '1'
      - uses: actions/setup-node@v4
        if: steps.slot.outputs.skip != '1'
        with:
          node-version: 20
      - name: 安裝寄信套件
        if: steps.slot.outputs.skip != '1'
        run: npm i --no-save --no-package-lock nodemailer@6.9.16
      - name: 取得最新資料
        if: steps.slot.outputs.skip != '1'
        run: |
          SITE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          mkdir -p out/data
          curl -fsS "$SITE/data/snapshot.json?t=$(date +%s)" -o out/data/snapshot.json
          curl -fsS "$SITE/data/news.json?t=$(date +%s)" -o out/data/news.json || true
      - name: 送出盤前資訊
        if: steps.slot.outputs.skip != '1'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BACKUP_GIST_ID: ${{ secrets.BACKUP_GIST_ID }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node pipeline/notify.js --premarket=${{ steps.slot.outputs.market }} --snap=out/data/snapshot.json
