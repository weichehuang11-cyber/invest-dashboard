name: 推播測試

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: '測試幾分鐘'
        default: '3'
      gap:
        description: '每幾秒一則'
        default: '20'
      topic:
        description: 'ntfy 主題（留空＝用 Secrets 的 NTFY_TOPIC）'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}-src   # 程式碼在私人 repo
          token: ${{ secrets.SRC_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 取得目前報價（網站資料已加密，下載後在這裡解開）
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          SITE_PASSPHRASE: ${{ secrets.SITE_PASSPHRASE }}
        run: node pipeline/fetch-site.js . snapshot || echo '{}' > snapshot.json
      - name: 送出測試推播
        env:
          NTFY_TOPIC: ${{ github.event.inputs.topic || secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          PRIVATE_LOG: '1'
        run: node pipeline/notify-test.js --snap=snapshot.json --minutes=${{ github.event.inputs.minutes }} --gap=${{ github.event.inputs.gap }}
