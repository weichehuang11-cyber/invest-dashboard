name: 資料來源測試

# 手動執行：測試 NAS 即時行情與台股補充資料（月營收、借券）的來源是否抓得到（結果顯示在執行摘要）
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 即時行情
        run: node nas/livefeed.js
      - name: 台股補充資料
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: node pipeline/lib/twdata.js
