name: 每週投資週報

# 週日晚上：本週回顧＋下週方向（推播＋選用電子郵件）。排程器會在 20:00 準時觸發，這裡的內建排程是備援。
on:
  schedule:
    - cron: '17 12 * * 0'     # 週日 20:17（台北）
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: 避免重複
        id: dup
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FROM=$(TZ=Asia/Taipei date -d 'today 00:00' -u +%FT%TZ)
          N=$(gh api "repos/${{ github.repository }}/actions/workflows/weekly.yml/runs?per_page=10&created=>=$FROM" --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.conclusion == \"success\")] | length")
          [ "$N" -gt 0 ] && { echo "本週已送過"; echo "skip=1" >> "$GITHUB_OUTPUT"; }
          true
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}-src   # 程式碼在私人 repo
          token: ${{ secrets.SRC_TOKEN }}
        if: steps.dup.outputs.skip != '1'
      - uses: actions/setup-node@v4
        if: steps.dup.outputs.skip != '1'
        with:
          node-version: 20
      - name: 安裝套件
        if: steps.dup.outputs.skip != '1'
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: 取得最新資料（網站資料已加密，下載後在這裡解開）
        if: steps.dup.outputs.skip != '1'
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          SITE_PASSPHRASE: ${{ secrets.SITE_PASSPHRASE }}
        run: |
          node pipeline/fetch-site.js out/data snapshot news industries twdata --bars=^TWII,^GSPC,^IXIC,^SOX
      - name: 送出週報
        if: steps.dup.outputs.skip != '1'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BACKUP_GIST_ID: ${{ secrets.BACKUP_GIST_ID }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          PRIVATE_LOG: '1'
        run: node pipeline/notify.js --weekly --snap=out/data/snapshot.json --bars=out/data/bars
