<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15181D">
<meta name="robots" content="noindex">
<title>訊號終端</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="訊號終端">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="tw-colors">
<a class="skip" href="#main">跳到主要內容</a>
<header class="topbar">
  <div class="wrap topbar-in">
    <a class="brand" href="#/">訊號終端</a>
    <nav class="topnav" aria-label="主選單">
      <a href="#/" data-nav="home">總覽</a>
      <a href="#/portfolio" data-nav="portfolio">持股</a>
      <a href="#/journal" data-nav="journal">我的成績</a>
      <a href="#/scorecard" data-nav="scorecard">系統成績</a>
      <a href="#/settings" data-nav="settings">設定</a>
    </nav>
    <div class="grow"></div>
    <div class="pills">
      <span id="pill-data" class="pill" title="資料來源與更新時間"><span class="dot"></span><span class="t">載入中…</span></span>
      <span id="pill-sync" class="pill" hidden><span class="dot"></span><span class="t"></span></span>
      <span id="pill-local" class="pill" title="本機加速（NPU／CPU／語言模型）"><span class="dot"></span><span class="t">偵測本機…</span></span>
    </div>
    <form id="search" class="search" role="search">
      <label for="search-input" class="sr">搜尋標的</label>
      <input id="search-input" type="search" enterkeyhint="search" placeholder="搜尋代號或名稱，如 2330、NVDA" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" aria-controls="search-results" aria-autocomplete="list">
      <button type="submit" class="search-go" aria-label="搜尋">搜尋</button>
      <ul id="search-results" class="search-results" role="listbox" hidden></ul>
    </form>
  </div>
</header>
<div id="banner" class="banner" hidden></div>
<main id="main" class="wrap main" tabindex="-1">
  <p class="loading">載入資料中…</p>
</main>
<nav class="bottomnav" aria-label="底部選單">
  <a href="#/" data-nav="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9H3z"/></svg>總覽</a>
  <a href="#/portfolio" data-nav="portfolio"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 10h18"/></svg>持股</a>
  <a href="#/journal" data-nav="journal"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h11l3 3v15H5z"/><path d="M9 9h6M9 13h6M9 17h4"/></svg>我的</a>
  <a href="#/scorecard" data-nav="scorecard"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>系統</a>
  <a href="#/settings" data-nav="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>設定</a>
</nav>
<script src="app.js"></script>
</body>
</html>
